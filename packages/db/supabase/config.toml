# Локальный стек Supabase для LogoCRM.
# Запуск из packages/db: supabase start  (или из корня: pnpm db:start)
project_id = "logocrm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Локальный почтовый ящик: magic link и письма подтверждения
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Локально письма не уходят наружу — magic link смотрим в Inbucket (:54324)
enable_confirmations = false

[analytics]
enabled = false
