name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN по умолчанию только на чтение — дефолт на репозитории может
# быть write. Единственное исключение объявлено на уровне джоба: `db` пишет
# в ветку PR сгенерированные типы (см. там), и только туда, никогда в main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # На ветках гасим устаревшие прогоны — это экономит минуты раннера.
  # На main нельзя: там в том же прогоне живёт джоб деплоя, и отмена убила бы
  # `supabase db push` посреди применения миграций. Второй пуш подряд оставил
  # бы историю миграций в состоянии, которое потом чинится руками.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Что тронул коммит — чтобы не гонять пятиминутную приёмку с браузером ради
  # правки отчёта или памяти. Фильтр на уровне джоба (`if:` у e2e), а не
  # `on.paths` у workflow: пропущенный по `if` джоб GitHub засчитывает как
  # успешный для required checks, а не запустившийся по `paths` workflow
  # висит в «Expected» и блокирует merge.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  app:
    name: Приложение (lint, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Версию не указываем: pnpm/action-setup читает packageManager
      # из package.json. Указать и то и другое — ошибка «Multiple versions
      # of pnpm specified».
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit-тесты (vitest)
        run: pnpm test

  db:
    name: База данных (миграции + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Единственный джоб с правом записи: коммитит в ветку PR канонические
    # типы, сгенерированные из миграций. В main не пишет никогда.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # До supabase start: дубль номера роняет db reset на
      # schema_migrations_pkey уже после двух минут подъёма контейнеров, а
      # так — за секунду и с внятным текстом. На pull_request шаг видит
      # merge-коммит с main, то есть ловит ветку, отставшую от занятого
      # номера.
      - name: Номера миграций уникальны
        working-directory: packages/db
        run: node scripts/check-migration-versions.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # ghcr.io регулярно отвечает toomanyrequests на подъёме образов
      # (supabase/postgres, kong, gotrue и т.д.) — транзиентный лимит
      # реестра, не связан с содержимым PR (23-24.09.2026, минимум пять
      # прогонов подряд на разных PR). Пять попыток с растущей паузой.
      - name: Запуск локального Supabase
        working-directory: packages/db
        run: |
          n=0
          until [ "$n" -ge 5 ]; do
            n=$((n + 1))
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start упал (попытка $n/5) — часто ghcr.io toomanyrequests, транзиентный лимит реестра"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((n * 15))
          done
          echo "::error::supabase start не поднялся за 5 попыток"
          exit 1

      - name: Применение миграций с нуля
        working-directory: packages/db
        run: supabase db reset

      - name: pgTAP-тесты
        working-directory: packages/db
        run: supabase test db

      # Локальный стек — единственный источник канонических типов: он собран
      # из тех же миграций, что поедут в prod.
      #
      # Сравниваем без комментариев и пустых строк: разные генераторы (CLI из
      # миграций против MCP из облака) дают косметические отличия — блок
      # __InternalSupabase и расстановку скобок в дженериках. Расхождение
      # раньше чинилось руками (скачать артефакт, подменить файл, запушить),
      # а ещё чаще — типы для новой RPC дописывались вручную по образцу.
      # Теперь тот же файл коммитит в ветку PR сам джоб, шаг ниже.
      - name: Сгенерировать канонические типы
        working-directory: packages/db
        run: supabase gen types typescript --local --schema public > /tmp/database.types.ts

      - name: Проверка, что типы совпадают с миграциями
        id: types
        working-directory: packages/db
        run: |
          norm() { grep -v '^//' "$1" | grep -v '^[[:space:]]*$'; }
          if diff -q <(norm /tmp/database.types.ts) <(norm src/database.types.ts) > /dev/null; then
            echo "Типы совпадают со схемой."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Расхождение (слева — из миграций, справа — в коммите):"
            diff <(norm /tmp/database.types.ts) <(norm src/database.types.ts) | head -60 || true
          fi

      # Коммит от GITHUB_TOKEN не запускает новый прогон CI — так GitHub
      # защищается от рекурсии. У коммита бота не будет своих проверок;
      # следующий пуш в ветку прогонит всё уже с актуальными типами. Обычно
      # он и так нужен: если типы для новой RPC не дописали, typecheck в app
      # уже упал в этом же прогоне.
      #
      # Тестировали merge-коммит (checkout по умолчанию), а писать надо в head
      # ветки — поэтому отдельный worktree, а не checkout поверх рабочей копии
      # с поднятым Supabase. Токен из actions/checkout лежит в .git/config и
      # общий для всех worktree.
      - name: Закоммитить канонические типы в ветку PR
        if: steps.types.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch --depth=1 origin "$HEAD_REF"
          git worktree add /tmp/head FETCH_HEAD
          cp /tmp/database.types.ts /tmp/head/packages/db/src/database.types.ts
          cd /tmp/head
          if git diff --quiet -- packages/db/src/database.types.ts; then
            echo "В ветке PR типы уже актуальны."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/database.types.ts
          git commit -m "chore(db): типы из схемы миграций — сгенерировано в CI"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::Типы закоммичены ботом в $HEAD_REF; у этого коммита нет своего прогона CI — он появится со следующим пушем."

      - name: Типы разошлись, а коммитить некуда
        if: steps.types.outputs.changed == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        run: echo "::warning::src/database.types.ts отличается от схемы — возьмите файл из артефакта database-types"

      - name: Выложить канонические типы артефактом
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: /tmp/database.types.ts
          retention-days: 7

      - name: Остановка Supabase
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup

  # Деплой зависит от db и app. pgTAP проверяет схему и права; в app крутится
  # Vitest с зеркалами SQL-логики — расхождение календаря серии между SQL и
  # TypeScript тоже не должно доехать до базы. Приёмка (e2e ниже) в
  # зависимости не входит намеренно: она про интерфейс, а не про схему.
  #
  # Только push в main: на pull_request джоб не запускается вовсе, иначе
  # ветка катила бы миграции в общий staging.
  #
  # Главный выигрыш переезда из workflow_run сюда — не скорость. В контексте
  # workflow_run checkout брал верхушку main, а не коммит, который проверял
  # pgTAP: между зелёным прогоном и деплоем мог проскочить ещё один пуш, и
  # деплой применял непроверенные миграции. Здесь checkout берёт тот же SHA.
  schema:
    name: Схема
    needs: [db, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  e2e:
    name: Приёмка (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # ghcr.io регулярно отвечает toomanyrequests на подъёме образов —
      # транзиентный лимит реестра, не связан с содержимым PR (см. джоб
      # db). Пять попыток с растущей паузой.
      - name: Запуск локального Supabase
        working-directory: packages/db
        run: |
          n=0
          until [ "$n" -ge 5 ]; do
            n=$((n + 1))
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start упал (попытка $n/5) — часто ghcr.io toomanyrequests, транзиентный лимит реестра"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((n * 15))
          done
          echo "::error::supabase start не поднялся за 5 попыток"
          exit 1

      # Схема собирается из миграций с нуля — тот же путь, что поедет в prod.
      - name: Применение миграций
        working-directory: packages/db
        run: supabase db reset

      # Фикстура отдельно от seed.sql: seed намеренно оставляет центр
      # несозданным, чтобы проверять онбординг, а приёмке нужен готовый центр.
      # Имена ключей в выводе status между версиями CLI не гарантированы,
      # поэтому берём первый подошедший из нескольких написаний и падаем с
      # понятным текстом, если не нашли ни одного. Молчаливо пустая
      # переменная привела бы к падению на сборке, где причина уже не видна.
      - name: Переменные локального стека
        working-directory: packages/db
        run: |
          supabase status --output json > /tmp/supabase-status.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("/tmp/supabase-status.json", "utf8"))
            const pick = (names) => {
              for (const n of names) if (s[n]) return s[n]
              throw new Error(
                `не найден ни один из ключей ${names.join(", ")}; доступны: ${Object.keys(s).join(", ")}`,
              )
            }
            const out = {
              E2E_DB_URL: pick(["DB_URL", "DB_URL_POSTGRES", "DbUrl"]),
              NEXT_PUBLIC_SUPABASE_URL: pick(["API_URL", "ApiUrl"]),
              NEXT_PUBLIC_SUPABASE_ANON_KEY: pick(["ANON_KEY", "PUBLISHABLE_KEY", "AnonKey"]),
            }
            require("fs").appendFileSync(
              process.env.GITHUB_ENV,
              Object.entries(out).map(([k, v]) => `${k}=${v}`).join("\n") + "\n",
            )
          '

      # Фикстура отдельно от seed.sql: seed намеренно оставляет центр
      # несозданным, чтобы проверять онбординг, а приёмке нужен готовый центр.
      - name: Фикстура для приёмки
        working-directory: packages/db
        run: psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -f supabase/fixtures/e2e.sql

      # Ключи локального стека фиксированные и публичные — это не секреты.
      - name: Переменные окружения приложения
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } > apps/web/.env.local

      # Инкрементальная сборка Next.js: ключ по lockfile и исходникам, а
      # restore-keys подхватывает ближайший предыдущий кэш — так советует
      # сам Next.js для CI.
      - name: Кэш сборки Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'packages/*/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Сборка приложения
        run: pnpm --filter @logocrm/web build

      # Chromium — ~150 МБ на каждый прогон. Версия браузера привязана к
      # версии playwright в lockfile, он и ключ кэша.
      - name: Кэш браузера Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Установка браузера
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @logocrm/web exec playwright install --with-deps chromium

      # Браузер из кэша, но системные библиотеки на свежем раннере нужны всё равно.
      - name: Системные зависимости браузера
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @logocrm/web exec playwright install-deps chromium

      - name: Приёмочные сценарии
        run: pnpm --filter @logocrm/web e2e

      - name: Отчёт Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          # Если джоб упал до запуска тестов, каталога нет — это не ошибка.
          if-no-files-found: ignore

      - name: Остановка Supabase
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup
