name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Приложение (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию не указываем: pnpm/action-setup читает packageManager
      # из package.json. Указать и то и другое — ошибка «Multiple versions
      # of pnpm specified».
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit-тесты (vitest)
        run: pnpm test

  db:
    name: База данных (миграции + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Запуск локального Supabase
        working-directory: packages/db
        run: supabase start

      - name: Применение миграций с нуля
        working-directory: packages/db
        run: supabase db reset

      - name: pgTAP-тесты
        working-directory: packages/db
        run: supabase test db

      # Комментарии (строки, начинающиеся с //) снимаются с обеих сторон:
      # в коммит мы добавляем шапку с инструкцией, а генератор её не пишет,
      # и без нормализации проверка ругалась бы всегда — такой сигнал
      # перестают читать.
      - name: Проверка, что типы совпадают с миграциями
        working-directory: packages/db
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.types.ts
          grep -v '^//' /tmp/generated.types.ts > /tmp/a.ts
          grep -v '^//' src/database.types.ts   > /tmp/b.ts
          if ! diff -q /tmp/a.ts /tmp/b.ts > /dev/null; then
            echo "::warning::src/database.types.ts отличается от схемы — выполните pnpm db:types"
            echo "Расхождение:"
            diff /tmp/a.ts /tmp/b.ts | head -40 || true
          fi

      - name: Остановка Supabase
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup
