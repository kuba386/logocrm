name: Deploy staging

# Катит миграции в staging после того, как CI на main отработал успешно.
#
# Привязка к workflow_run, а не к push — намеренно: так деплой физически
# не может опередить pgTAP. Правило «схема только через зелёный db-джоб»
# держится зависимостью между workflow, а не дисциплиной.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Миграции в staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # Секрет даёт доступ к одной базе, и ошибиться проектом легко: в том же
      # аккаунте Supabase рядом живёт старый logoped-crm с боевыми данными
      # детей. Строка подключения туда уже уезжала однажды, и от применения
      # миграций LogoCRM поверх боевой базы спасло только то, что прямой хост
      # отвечает по IPv6, а раннер ходит по IPv4. Полагаться на это нельзя.
      #
      # Сама строка нигде не печатается: сравнение идёт через case, ref
      # проекта секретом не является — он и так лежит в репозитории.
      - name: Строка подключения ведёт в staging LogoCRM
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_REF: hiwstqrnxrlfuanvfggq
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Секрет SUPABASE_DB_URL пуст или недоступен. Он должен лежать в Environments → staging."
            exit 1
          fi

          # Ref вытаскиваем только из структурных позиций — из имени
          # пользователя до двоеточия и из хоста после собаки. Поле пароля
          # лежит между ними и под шаблон не попадает, так что напечатать
          # кусок секрета эта строка не может.
          DETECTED=$(printf '%s' "$SUPABASE_DB_URL" \
            | grep -oE '(postgres\.[a-z]{20}:|@db\.[a-z]{20}\.supabase\.co)' \
            | grep -oE '[a-z]{20}' | head -1)

          case "$SUPABASE_DB_URL" in
            *"$EXPECTED_REF"*)
              echo "Проект $EXPECTED_REF — верный, продолжаем."
              ;;
            *)
              echo "::error::Строка подключения ведёт в проект «${DETECTED:-не распознан}», а ожидался $EXPECTED_REF. Миграции не применяются. Секрет лежит в Environments → staging; значение оттуда перекрывает Repository secrets."
              exit 1
              ;;
          esac

          case "$SUPABASE_DB_URL" in
            *db.*.supabase.co*)
              echo "::warning::Похоже на Direct connection. Он отвечает только по IPv6, а раннеры GitHub работают по IPv4 — используйте Session pooler на порту 5432."
              ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Работаем по строке подключения, без supabase link.
      #
      # Так нужен один секрет вместо двух, и это доступ к одной базе, а не
      # токен ко всему аккаунту Supabase — таким можно удалить любой проект
      # организации, включая боевой logoped-crm.
      - name: Что будет применено
        working-directory: packages/db
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Применить миграции
        working-directory: packages/db
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Состояние после применения
        working-directory: packages/db
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
