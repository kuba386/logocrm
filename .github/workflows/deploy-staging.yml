name: Deploy staging

# Катит миграции в staging после того, как CI на main отработал успешно.
#
# Привязка к workflow_run, а не к push — намеренно: так деплой физически
# не может опередить pgTAP. Правило «схема только через зелёный db-джоб»
# держится зависимостью между workflow, а не дисциплиной.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Миграции в staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Работаем по строке подключения, без supabase link.
      #
      # Так нужен один секрет вместо двух, и это доступ к одной базе, а не
      # токен ко всему аккаунту Supabase — таким можно удалить любой проект
      # организации, включая боевой logoped-crm.
      - name: Что будет применено
        working-directory: packages/db
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Применить миграции
        working-directory: packages/db
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Состояние после применения
        working-directory: packages/db
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
